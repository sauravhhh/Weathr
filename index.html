<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="icons/icon-192x192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  <title>Weathr - 5 Day Forecast</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      margin: 0;
      padding: 32px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #111111;
      margin: 0 0 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #111111;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: block;
    }
    .search-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 32px;
    }
    .search-box {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
    }
    .clear-btn {
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #999999;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 6px;
      display: none;
    }
    .clear-btn.visible {
      display: block;
    }
    .clear-btn:hover {
      color: #111111;
    }
    .location-input {
      flex: 1;
      min-width: 0;
      padding: 10px 28px 10px 2px;
      font-size: 15px;
      color: #111111;
      border: 0;
      border-bottom: 1px solid #cccccc;
      border-radius: 0;
      outline: none;
      background: transparent;
      transition: border-color 0.2s ease;
    }
    .location-input::placeholder {
      color: #999999;
    }
    .location-input:focus {
      border-color: #1a73e8;
    }
    .search-btn {
      flex-shrink: 0;
      background: #1a73e8;
      color: #ffffff;
      border: 0;
      border-radius: 0;
      padding: 11px 18px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .search-btn:hover {
      background: #1557b0;
    }
    .loading {
      color: #666666;
      margin: 20px 0;
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .loading-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #e5e5e5;
      border-top: 2px solid #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      color: #111111;
      background: #f5f5f5;
      border-left: 2px solid #111111;
      padding: 12px 14px;
      margin: 20px 0;
      font-size: 13px;
      display: none;
    }
    .current-weather {
      text-align: left;
      padding: 0;
    }
    .location-name {
      font-size: 20px;
      font-weight: 600;
      color: #111111;
      margin-bottom: 4px;
    }
    .current-datetime {
      font-size: 13px;
      color: #666666;
    }
    .weather-icon {
      font-size: 40px;
      margin: 20px 0 8px;
    }
    .temp-main {
      font-size: 72px;
      font-weight: 200;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #1a73e8;
      margin: 8px 0 12px;
    }
    .weather-desc {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #666666;
      margin-bottom: 0;
    }
    .weather-details {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e5e5e5;
    }
    .detail-card {
      background: transparent;
      padding: 0;
      text-align: left;
    }
    .detail-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #999999;
      margin-bottom: 6px;
    }
    .detail-value {
      font-size: 16px;
      font-weight: 600;
      color: #111111;
    }
    .forecast-container {
      margin-top: 40px;
    }
    .forecast-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #666666;
      margin-bottom: 0;
      padding-bottom: 10px;
      border-bottom: 1px solid #111111;
      text-align: left;
    }
    .forecast-day {
      background: transparent;
      border-radius: 0;
      padding: 16px 0;
      margin-bottom: 0;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .day-info {
      flex: 1;
    }
    .day-name {
      font-size: 15px;
      font-weight: 600;
      color: #111111;
      margin-bottom: 2px;
    }
    .day-date {
      font-size: 12px;
      color: #999999;
    }
    .day-temps {
      flex: 1;
      text-align: right;
    }
    .temp-high {
      font-size: 16px;
      font-weight: 600;
      color: #111111;
    }
    .temp-low {
      font-size: 14px;
      color: #999999;
    }
    .day-details {
      flex: 1.5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
      font-size: 12px;
    }
    .mini-detail {
      text-align: right;
      padding: 0;
      background: transparent;
      border-radius: 0;
      color: #666666;
      font-weight: 400;
    }
    .footer {
      margin: 40px 0 8px;
      text-align: center;
      font-size: 12px;
      color: #999999;
    }
    .weather-section {
      display: none;
    }
    @media (max-width: 480px) {
      body {
        padding: 24px 16px;
      }
      .temp-main {
        font-size: 60px;
      }
      .weather-details {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .day-details {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><img class="logo" src="icons/icon-192x192.png" alt="Weathr logo" />Weathr</h1>
    
    <div class="search-row">
      <div class="search-box">
        <input type="text" class="location-input" id="cityInput" placeholder="Enter place (e.g. New York, Delhi etc)" />
        <button class="clear-btn" id="clearBtn" type="button" aria-label="Clear search" title="Clear">×</button>
      </div>
      <button class="search-btn" id="getWeatherBtn">Get Weather</button>
    </div>
    
    <div class="loading" id="loadingState">
      <div class="loading-spinner"></div>
      Loading weather data...
    </div>
    <div class="error" id="errorState"></div>
    
    <div class="weather-section" id="weatherSection">
      <div class="current-weather">
        <div class="location-name" id="locationName">-</div>
        <div class="current-datetime" id="currentDateTime">-</div>
        <div class="weather-icon" id="weatherIcon">🌤️</div>
        <div class="temp-main" id="tempMain">-°C</div>
        <div class="weather-desc" id="weatherDesc">-</div>
        
        <div class="weather-details">
          <div class="detail-card">
            <div class="detail-label">Humidity</div>
            <div class="detail-value" id="humidityValue">-%</div>
          </div>
          <div class="detail-card">
            <div class="detail-label">Wind</div>
            <div class="detail-value" id="windValue">- km/h</div>
          </div>
          <div class="detail-card">
            <div class="detail-label">Pressure</div>
            <div class="detail-value" id="pressureValue">- hPa</div>
          </div>
          <div class="detail-card">
            <div class="detail-label">UV Index</div>
            <div class="detail-value" id="uvValue">-</div>
          </div>
        </div>
      </div>
      
      <div class="forecast-container">
        <div class="forecast-title">5-Day Forecast</div>
        <div id="forecastList"></div>
      </div>
    </div>
  </div>
  
  <div class="footer">Made with ❤️ by sauravhhh</div>

  <script>
    const cityInput = document.getElementById('cityInput');
    const getWeatherBtn = document.getElementById('getWeatherBtn');
    const clearBtn = document.getElementById('clearBtn');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const weatherSection = document.getElementById('weatherSection');
    
    const locationName = document.getElementById('locationName');
    const currentDateTime = document.getElementById('currentDateTime');
    const weatherIcon = document.getElementById('weatherIcon');
    const tempMain = document.getElementById('tempMain');
    const weatherDesc = document.getElementById('weatherDesc');
    const humidityValue = document.getElementById('humidityValue');
    const windValue = document.getElementById('windValue');
    const pressureValue = document.getElementById('pressureValue');
    const uvValue = document.getElementById('uvValue');
    const forecastList = document.getElementById('forecastList');

    // Store timezone offset for location-based time updates
    let currentTimezoneOffset = 0;
    let locationTimezone = '';

    const weatherIcons = {
      0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️', 45: '🌫️', 48: '🌫️',
      51: '🌦️', 53: '🌦️', 55: '🌧️', 61: '🌧️', 63: '🌧️', 65: '🌧️',
      71: '❄️', 73: '❄️', 75: '❄️', 80: '🌦️', 81: '🌧️', 82: '⛈️',
      95: '⛈️', 96: '⛈️', 99: '⛈️'
    };

    const weatherDescriptions = {
      0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
      45: 'Fog', 48: 'Depositing rime fog', 51: 'Light drizzle', 53: 'Moderate drizzle',
      55: 'Dense drizzle', 61: 'Slight rain', 63: 'Moderate rain', 65: 'Heavy rain',
      71: 'Slight snow', 73: 'Moderate snow', 75: 'Heavy snow',
      80: 'Slight rain showers', 81: 'Moderate rain showers', 82: 'Violent rain showers',
      95: 'Thunderstorm', 96: 'Thunderstorm with hail', 99: 'Thunderstorm with heavy hail'
    };

    function getLocationDateTime(timezoneOffsetSeconds) {
      const now = new Date();
      // Get UTC time and add the location's timezone offset
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const localTime = new Date(utc + (timezoneOffsetSeconds * 1000));
      
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      
      const dayName = dayNames[localTime.getDay()];
      const day = localTime.getDate();
      const monthName = monthNames[localTime.getMonth()];
      const year = localTime.getFullYear();
      const hour = localTime.getHours();
      const minute = localTime.getMinutes();
      
      // Convert to 12-hour format
      const displayHour = hour === 0 ? 12 : hour > 12 ? hour - 12 : hour;
      const period = hour < 12 ? 'AM' : 'PM';
      const displayMinute = minute.toString().padStart(2, '0');
      
      // Add ordinal suffix to day
      const getOrdinal = (n) => {
        const s = ["th", "st", "nd", "rd"];
        const v = n % 100;
        return n + (s[(v - 20) % 10] || s[v] || s[0]);
      };
      
      return `${dayName}, ${getOrdinal(day)} ${monthName} ${year} (${displayHour}:${displayMinute} ${period})`;
    }

    // Update time every minute using the stored timezone offset
    function updateDateTime() {
      if (currentDateTime.textContent !== '-' && currentTimezoneOffset !== null) {
        currentDateTime.textContent = getLocationDateTime(currentTimezoneOffset);
      }
    }

    // Update time every 60 seconds
    setInterval(updateDateTime, 60000);

    async function getCoordinates(cityName) {
      const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`);
      const data = await response.json();
      
      if (data.results && data.results.length > 0) {
        const result = data.results[0];
        return {
          lat: result.latitude,
          lon: result.longitude,
          name: result.name,
          country: result.country || ''
        };
      } else {
        throw new Error('City not found');
      }
    }

    async function getWeatherData(lat, lon) {
      const response = await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,surface_pressure&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,wind_speed_10m_max,relative_humidity_2m_mean&timezone=auto&forecast_days=5`
      );
      
      if (!response.ok) {
        throw new Error('Weather data not available');
      }
      
      return await response.json();
    }

    function displayCurrentWeather(data, coords) {
      const current = data.current;
      
      // Store timezone offset from API response
      currentTimezoneOffset = data.utc_offset_seconds || 0;
      locationTimezone = data.timezone || '';
      
      locationName.textContent = `${coords.name}${coords.country ? ', ' + coords.country : ''}`;
      currentDateTime.textContent = getLocationDateTime(currentTimezoneOffset);
      weatherIcon.textContent = weatherIcons[current.weather_code] || '🌤️';
      tempMain.textContent = `${Math.round(current.temperature_2m)}°C`;
      weatherDesc.textContent = weatherDescriptions[current.weather_code] || 'Unknown';
      
      humidityValue.textContent = `${current.relative_humidity_2m}%`;
      windValue.textContent = `${Math.round(current.wind_speed_10m)} km/h`;
      pressureValue.textContent = `${Math.round(current.surface_pressure)} hPa`;
      uvValue.textContent = Math.round(data.daily.uv_index_max[0]) || 'N/A';
    }

    function displayForecast(data) {
      forecastList.innerHTML = '';
      const dayNamesShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      
      for (let i = 0; i < 5; i++) {
        const date = new Date(data.daily.time[i]);
        const dayName = i === 0 ? 'Today' : dayNamesShort[date.getDay()];
        const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        
        const forecastDay = document.createElement('div');
        forecastDay.className = 'forecast-day';
        
        const windVal = data.daily.wind_speed_10m_max[i] ? Math.round(data.daily.wind_speed_10m_max[i]) : 'N/A';
        const humidVal = data.daily.relative_humidity_2m_mean[i] ? Math.round(data.daily.relative_humidity_2m_mean[i]) : 'N/A';
        
        forecastDay.innerHTML = `
          <div class="day-info">
            <div class="day-name">${dayName}</div>
            <div class="day-date">${dateStr}</div>
          </div>
          <div class="day-temps">
            <div class="temp-high">${Math.round(data.daily.temperature_2m_max[i])}°</div>
            <div class="temp-low">${Math.round(data.daily.temperature_2m_min[i])}°</div>
          </div>
          <div class="day-details">
            <div class="mini-detail">Wind ${windVal} km/h</div>
            <div class="mini-detail">Humidity ${humidVal}%</div>
          </div>
        `;
        
        forecastList.appendChild(forecastDay);
      }
    }

    function showLoading() {
      loadingState.style.display = 'flex';
      errorState.style.display = 'none';
      weatherSection.style.display = 'none';
    }

    function hideLoading() {
      loadingState.style.display = 'none';
    }

    function showError(message) {
      errorState.textContent = message;
      errorState.style.display = 'block';
      weatherSection.style.display = 'none';
      hideLoading();
    }

    function showWeather() {
      weatherSection.style.display = 'block';
      errorState.style.display = 'none';
      hideLoading();
    }

    async function fetchWeather() {
      const city = cityInput.value.trim();
      if (!city) {
        showError('Please enter a place name');
        return;
      }

      showLoading();

      try {
        const coords = await getCoordinates(city);
        const weatherData = await getWeatherData(coords.lat, coords.lon);
        
        displayCurrentWeather(weatherData, coords);
        displayForecast(weatherData);
        showWeather();
      } catch (error) {
        showError(error.message);
      }
    }

    function toggleClearBtn() {
      clearBtn.classList.toggle('visible', cityInput.value.length > 0);
    }

    cityInput.addEventListener('input', toggleClearBtn);
    clearBtn.addEventListener('click', () => {
      cityInput.value = '';
      toggleClearBtn();
      cityInput.focus();
    });

    getWeatherBtn.addEventListener('click', fetchWeather);
    cityInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        fetchWeather();
      }
    });
  </script>
</body>
</html>
